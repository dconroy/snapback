<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0c0e">
  <title>Snapback</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0c0e;
      --surface: #16181c;
      --surface-2: #1f2228;
      --line: rgba(255, 255, 255, 0.07);
      --text: #f4f5f7;
      --muted: #8b919b;
      --green: #30d158;
      --amber: #ffb340;
      --red: #ff453a;
      --radius: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0 auto;
      max-width: 520px;
      padding: max(18px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }
    .brand { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .pill.ok .dot { background: var(--green); box-shadow: 0 0 0 4px rgba(48, 209, 88, 0.18); }
    .pill.warn .dot { background: var(--amber); }
    .pill.bad .dot { background: var(--red); }
    #error {
      display: none;
      margin: -10px 0 18px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 69, 58, 0.1);
      color: #ff9f97;
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .actions { display: grid; gap: 12px; margin-bottom: 26px; }
    .action {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      min-height: 104px;
      padding: 20px;
      border: 0;
      border-radius: var(--radius);
      font: inherit;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease, filter 0.12s ease, opacity 0.2s;
    }
    .action:active { transform: scale(0.98); }
    .action:disabled { cursor: default; opacity: 0.6; }
    .action .icon {
      flex: none;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 14px;
    }
    .action svg { width: 26px; height: 26px; }
    .action .label { display: block; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
    .action .sub { display: block; margin-top: 3px; font-size: 14px; opacity: 0.7; }
    #shot { background: var(--text); color: #111; }
    #shot .icon { background: rgba(0, 0, 0, 0.07); }
    #replay { background: var(--red); color: #fff; }
    #replay .icon { background: rgba(255, 255, 255, 0.18); }
    .track {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 12px;
      height: 4px;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
    .meter {
      display: block;
      height: 100%;
      width: 0;
      background: rgba(255, 255, 255, 0.9);
      transition: width 0.6s ease;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    h2 {
      margin: 0 0 10px 4px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .media {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #000;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
    }
    .meta { min-width: 0; }
    .meta strong { display: block; font-size: 14px; font-weight: 600; }
    .meta span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .open {
      flex: none;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text);
    }
    .open svg { width: 17px; height: 17px; }

    #live { position: relative; margin-bottom: 18px; }
    .glass {
      position: absolute;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
    }
    #live-badge {
      top: 10px;
      left: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    #live-badge .dot { width: 7px; height: 7px; background: var(--red); }
    #live-toggle {
      top: 8px;
      right: 8px;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
    }
    #live-toggle svg { width: 20px; height: 20px; }

    .recent { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .recent .card { margin: 0; }
    .recent .empty { font-size: 13px; }
    .thumb { position: relative; display: block; }
    .thumb video { pointer-events: none; }
    .thumb .play {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }
    .thumb .play svg { width: 34px; height: 34px; padding: 9px; border-radius: 50%; background: rgba(0, 0, 0, 0.55); color: #fff; }
    .empty {
      display: grid;
      place-items: center;
      aspect-ratio: 16 / 9;
      color: var(--muted);
      font-size: 14px;
      background: repeating-linear-gradient(135deg, var(--surface), var(--surface) 10px, #181a1f 10px, #181a1f 20px);
    }

    footer { margin-top: 20px; text-align: center; font-size: 12px; line-height: 1.6; color: var(--muted); }

    #toast {
      position: fixed;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      max-width: calc(100% - 36px);
      padding: 12px 16px;
      border-radius: 14px;
      background: #2a2d34;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.bad { background: #4a1f1c; color: #ffd2ce; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Snapback</div>
    <div id="pill" class="pill"><span class="dot"></span><span id="pill-text">Connecting…</span></div>
  </header>
  <div id="error"></div>

  <div class="card" id="live">
    <img id="live-frame" class="media" alt="Live HDMI preview" hidden>
    <video id="live-video" class="media" playsinline controls hidden></video>
    <div id="live-empty" class="empty">No live signal</div>
    <span id="live-badge" class="glass" hidden><span class="dot"></span><span id="live-badge-text">LIVE</span></span>
    <button id="live-toggle" class="glass" type="button" aria-label="Watch with sound"></button>
  </div>

  <div class="actions">
    <button id="shot" class="action" type="button">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </span>
      <span><span class="label">Grab Screenshot</span><span class="sub">Saves a full-size JPEG</span></span>
    </button>
    <button id="replay" class="action" type="button">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>
      </span>
      <span><span class="label">Download Last 30 Seconds</span><span class="sub" id="replay-sub">Saves an MP4 with audio</span></span>
      <span class="track"><span class="meter" id="meter"></span></span>
    </button>
  </div>

  <h2>Recent</h2>
  <div class="recent">
    <div class="card" id="latest-shot"><div class="empty">No screenshot yet</div></div>
    <div class="card" id="latest-replay"><div class="empty">No clip yet</div></div>
  </div>

  <footer><span id="footer"></span><br>Home project, provided as-is without warranty. You're responsible for what you capture.</footer>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let shownShot = null;
    let shownReplay = null;
    let toastTimer = null;

    function when(iso) {
      const d = new Date(iso);
      const sameDay = d.toDateString() === new Date().toDateString();
      return sameDay
        ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
        : d.toLocaleDateString([], { month: "short", day: "numeric" });
    }

    const ICONS = {
      save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>',
      play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
      muted: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
      sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19.5 5.5a9 9 0 0 1 0 13"/></svg>',
    };

    function mb(bytes) {
      return bytes >= 1e6 ? (bytes / 1e6).toFixed(0) + " MB" : (bytes / 1e3).toFixed(0) + " KB";
    }

    function toast(text, bad) {
      const el = $("toast");
      el.textContent = text;
      el.className = "show" + (bad ? " bad" : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => (el.className = bad ? "bad" : ""), bad ? 5000 : 2500);
    }

    function row(title, detail, item, label) {
      const r = document.createElement("div");
      r.className = "row";
      const meta = document.createElement("div");
      meta.className = "meta";
      const strong = document.createElement("strong");
      strong.textContent = title;
      const span = document.createElement("span");
      span.textContent = detail;
      meta.append(strong, span);
      const a = document.createElement("a");
      a.className = "open";
      a.href = item.url;
      a.download = item.filename;
      a.setAttribute("aria-label", label);
      a.innerHTML = ICONS.save;
      r.append(meta, a);
      return r;
    }

    function thumb(item, media) {
      const link = document.createElement("a");
      link.className = "thumb";
      link.href = item.url;
      media.className = "media";
      link.append(media);
      return link;
    }

    function renderShot(item) {
      if (!item || item.filename === shownShot) return;
      shownShot = item.filename;
      const img = document.createElement("img");
      img.src = item.url;
      img.alt = "Latest screenshot";
      $("latest-shot").replaceChildren(thumb(item, img), row(when(item.created_at), mb(item.size_bytes) + " · JPEG", item, "Save screenshot"));
    }

    function renderReplay(item) {
      if (!item || item.filename === shownReplay) return;
      shownReplay = item.filename;
      const video = document.createElement("video");
      video.src = item.url + "#t=0.1";
      video.muted = true;
      video.playsInline = true;
      video.preload = "metadata";
      const link = thumb(item, video);
      const play = document.createElement("span");
      play.className = "play";
      play.innerHTML = ICONS.play;
      link.append(play);
      const length = item.approx_seconds ? item.approx_seconds + " s · " : "";
      $("latest-replay").replaceChildren(link, row(when(item.created_at), length + mb(item.size_bytes) + " · MP4", item, "Download clip"));
    }

    function renderStatus(s) {
      const pill = $("pill");
      let cls = "", text = "Buffer off";
      if (!s.device_detected) {
        cls = "bad"; text = "No capture device";
      } else if (s.buffer_state === "running") {
        cls = "ok"; text = "Live";
      } else if (s.buffer_state === "starting") {
        cls = "warn"; text = "Starting…";
      } else if (s.buffer_state === "restarting") {
        cls = "warn"; text = "Reconnecting…";
      }
      pill.className = "pill " + cls;
      $("pill-text").textContent = text;

      const showError = s.last_error && s.buffer_state !== "running";
      $("error").style.display = showError ? "block" : "none";
      $("error").textContent = showError ? s.last_error.slice(0, 240) : "";

      const ready = Math.min(s.buffered_seconds, s.replay_seconds);
      $("meter").style.width = (s.buffer_running ? (100 * ready) / s.replay_seconds : 0) + "%";
      if (!s.buffer_running) $("replay-sub").textContent = "Buffer not running";
      else if (ready < s.replay_seconds) $("replay-sub").textContent = ready + " s of " + s.replay_seconds + " s buffered";
      else $("replay-sub").textContent = "Ready · saves an MP4 with audio";

      $("footer").textContent = s.capture_mode + " · " + (s.disk_free_bytes / 1e9).toFixed(0) + " GB free";
      renderShot(s.latest_screenshot);
      renderReplay(s.latest_replay);
    }

    async function refresh() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        renderStatus(await res.json());
      } catch (err) {
        $("pill").className = "pill bad";
        $("pill-text").textContent = "Offline";
      }
    }

    async function action(button, url, busyText) {
      const icon = button.querySelector(".icon");
      const label = button.querySelector(".label");
      const iconHtml = icon.innerHTML;
      const labelText = label.textContent;
      button.disabled = true;
      icon.innerHTML = '<span class="spinner"></span>';
      label.textContent = busyText;
      try {
        const res = await fetch(url, { method: "POST" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);
        if (data.media_type === "screenshot") {
          renderShot(data);
          toast("Screenshot saved");
        } else {
          renderReplay(data);
          toast("Clip saved · " + mb(data.size_bytes));
        }
      } catch (err) {
        toast(err.message, true);
      } finally {
        button.disabled = false;
        icon.innerHTML = iconHtml;
        label.textContent = labelText;
        refresh();
      }
    }

    let liveVideo = false;
    let frameTimer = null;
    let frameUrl = null;

    function showLive(mode) {
      $("live-frame").hidden = mode !== "frame";
      $("live-video").hidden = mode !== "video";
      $("live-empty").hidden = mode !== "empty";
      $("live-badge").hidden = mode === "empty";
    }

    function setToggle(on) {
      const toggle = $("live-toggle");
      toggle.innerHTML = on ? ICONS.sound : ICONS.muted;
      toggle.setAttribute("aria-label", on ? "Back to silent preview" : "Watch with sound");
      $("live-badge-text").textContent = on ? "LIVE · SOUND · ~5 S DELAY" : "LIVE";
    }

    let framePending = false;

    async function pollFrame() {
      clearTimeout(frameTimer);
      if (liveVideo || document.hidden || framePending) return;
      framePending = true;
      try {
        const res = await fetch("/live/frame.jpg", { cache: "no-store" });
        if (!res.ok) throw new Error(res.statusText);
        const url = URL.createObjectURL(await res.blob());
        if (liveVideo) {
          URL.revokeObjectURL(url);
          return;
        }
        $("live-frame").src = url;
        if (frameUrl) URL.revokeObjectURL(frameUrl);
        frameUrl = url;
        showLive("frame");
      } catch (err) {
        if (!liveVideo) showLive("empty");
      } finally {
        framePending = false;
      }
      if (!liveVideo) frameTimer = setTimeout(pollFrame, 500);
    }

    function setLiveVideo(on) {
      liveVideo = on;
      const video = $("live-video");
      if (on) {
        clearTimeout(frameTimer);
        video.src = "/live/stream.m3u8";
        video.play().catch(() => {});
        showLive("video");
      } else {
        video.pause();
        video.removeAttribute("src");
        video.load();
        pollFrame();
      }
      setToggle(on);
    }

    setToggle(false);

    if ($("live-video").canPlayType("application/vnd.apple.mpegurl") === "") {
      $("live-toggle").hidden = true;
    }
    $("live-toggle").addEventListener("click", () => setLiveVideo(!liveVideo));
    $("live-video").addEventListener("error", () => {
      if (!liveVideo) return;
      setLiveVideo(false);
      toast("Live video stopped. Try again in a few seconds.", true);
    });
    document.addEventListener("visibilitychange", pollFrame);
    pollFrame();

    $("shot").addEventListener("click", () => action($("shot"), "/api/screenshot", "Grabbing…"));
    $("replay").addEventListener("click", () => action($("replay"), "/api/replay", "Saving clip…"));
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
